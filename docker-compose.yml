services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4567
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      KPI_API_KEY: ${KPI_API_KEY}
      FLIGHTDECK_URL: ${FLIGHTDECK_URL:-http://flightdeck:8080}
      FLIGHTDECK_INGEST_KEY: ${FLIGHTDECK_INGEST_KEY}
    volumes:
      - game-data:/app/data
    networks:
      - default
      - flightdeck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4567/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  game-data:

networks:
  flightdeck:
    external: true
    name: docker-services_default
