services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      NODE_ENV: production
      PORT: 4567
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - game-data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  game-data:
